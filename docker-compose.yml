services:
  app:
    build: .
    ports:
      - 8000:8000
    env_file: ".env"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./alembic:/home/runner/app/alembic:z
  db:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    shm_size: 128mb
    env_file: ".env"
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
