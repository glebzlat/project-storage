services:

  app:
    profiles: ["prod"]
    build: .
    restart: unless-stopped
    command: ["run", "src/project_storage/main.py"]
    ports:
      - 8000:8000
    env_file: ".env"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./alembic:/home/runner/app/alembic:z

  app-dev:
    profiles: ["dev"]
    build: .
    restart: unless-stopped
    command: ["dev", "--reload", "src/project_storage/main.py"]
    ports:
      - 8000:8000
    env_file: ".env"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: ./src
          action: sync+restart
          target: /home/runner/app/src
        - path: ./pyproject.toml
          action: rebuild
    volumes:
      - ./alembic:/home/runner/app/alembic:z

  db:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    shm_size: 128mb
    env_file: ".env"
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
      start_interval: 0.5s
